<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="canonical" href="{{ site.url }}{{ page.url }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
  <style>
    :root {
      --navy: #002039;
      --ink: #0f1a24;
      --muted: #4a5a6a;
      --page: #f7f8fa;
      --card: #ffffff;
      --hairline: #e3e8ee;
      --accent: #1f6f8b;
      --accent-ink: #0d4a61;
      color-scheme: light;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --navy: #dbe7f2;
        --ink: #e6ecf2;
        --muted: #a3b2c1;
        --page: #0b1620;
        --card: #111f2c;
        --hairline: #22333f;
        --accent: #6fb7d1;
        --accent-ink: #9fd0e2;
        color-scheme: dark;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--page);
      color: var(--ink);
      font: 17px/1.65 "Source Sans 3", system-ui, sans-serif;
    }
    header.site, footer.site { max-width: 820px; margin: 0 auto; padding: 24px 16px; }
    header.site a { display: inline-flex; align-items: center; gap: 12px; color: var(--navy); text-decoration: none;
      font: 700 18px/1 "Archivo", system-ui, sans-serif; letter-spacing: .02em; }
    .logo { width: 40px; height: auto; }
    main {
      max-width: 820px; margin: 0 auto 32px; padding: 40px 48px;
      background: var(--card); border: 1px solid var(--hairline); border-radius: 12px;
    }
    h1, h2, h3 { font-family: "Archivo", system-ui, sans-serif; color: var(--navy); line-height: 1.25; }
    h1 { font-size: 2rem; margin: 0 0 .5rem; }
    h2 { font-size: 1.35rem; margin: 2.2rem 0 .6rem; padding-top: 1.2rem; border-top: 1px solid var(--hairline); }
    h3 { font-size: 1.1rem; margin: 1.6rem 0 .4rem; }
    a { color: var(--accent); }
    a:hover { color: var(--accent-ink); }
    ul { padding-left: 1.3rem; }
    li { margin: .2rem 0; }
    footer.site { color: var(--muted); font-size: 14px; padding-top: 0; }
    @media (max-width: 640px) {
      body { font-size: 16px; }
      main { padding: 24px 16px; border-radius: 0; border-left: 0; border-right: 0; }
      h1 { font-size: 1.6rem; }
    }
    @media print {
      body { background: #fff; }
      main { border: 0; padding: 0; }
    }
  </style>
</head>
<body>
  <header class="site">
    <a href="{{ '/' | relative_url }}">{% include logo.svg %}<span>AlterEyes</span></a>
  </header>
  <main>
{{ content }}
  </main>
  <footer class="site">
    AlterEyes NV · Vissersstraat 1 K6, 3500 Hasselt, Belgium · KBO/CBE 0723.518.446 ·
    <a href="mailto:info@altereyes.com">info@altereyes.com</a>
  </footer>
</body>
</html>
